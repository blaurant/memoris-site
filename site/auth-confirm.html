<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Memoris on your phone - Memoris AI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="kit/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="kit/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="auth-confirm.css">
</head>
<body class="confirm" data-pin="none">
<header data-masthead></header>

<main>
  <section class="open" data-state="pending" data-opener data-wait-fonts>
    <svg class="gyrus" data-gyrus="h" style="--w:210px;--r:-30deg;right:-92px;top:16%" aria-hidden="true"></svg><svg class="gyrus" data-gyrus="c" style="--w:220px;--r:-12deg;left:-98px;bottom:6%" aria-hidden="true"></svg>
    <div class="wrap open__copy">
      <h1 class="d rv" data-title>Open Memoris on your phone</h1>
      <div class="open__act rv" style="--wait:.1s">
        <a class="btn" data-open aria-disabled="true">Open Memoris</a>
        <p class="open__error" role="status" data-error hidden>This link is incomplete. Request a new one from the app.</p>
      </div>
    </div>
    <figure class="open__art">
      <svg data-scene="link" viewBox="0 112 1200 370" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    </figure>
  </section>
</main>

<footer data-footer></footer>

<script src="kit/keepers.js"></script>
<script src="kit/kit.js"></script>
<script src="auth-confirm.js"></script>
</body>
</html>
